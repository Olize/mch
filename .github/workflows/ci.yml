name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: Test and build (macos-latest)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (2026-10-21)
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify architecture
        run: test "$(uname -m)" = arm64
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Select exFAT checks for the public runtime
        id: runtime
        shell: bash
        run: |
          python3 - <<'VERSION' >> "$GITHUB_OUTPUT"
          import re
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          major, minor, patch = map(int, re.match(r"^(\d+)\.(\d+)\.(\d+)", version).groups())
          print("exfat=" + str((major, minor, patch) >= (0, 2, 3)).lower())
          VERSION
      - name: Copy on disposable mounted exFAT disk image, never clobber existing target
        if: steps.runtime.outputs.exfat == 'true'
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/mch-exfat-test.dmg"
          hdiutil create -size 128m -fs ExFAT -volname MCHXFAT "$image"
          hdiutil attach -nobrowse "$image"
          trap 'hdiutil detach /Volumes/MCHXFAT || true' EXIT
          volume=/Volumes/MCHXFAT
          [[ "$(diskutil info "$volume" | grep 'File System Personality')" == *ExFAT* ]]
          printf 'signed-mch-exfat-test\n' > "$volume/src"
          # Without explicit consent, refuse a filesystem that cannot
          # atomically publish without replacing an existing target.
          if target/release/mch -q "$volume/src" "$volume/dest"; then
            echo 'UNSAFE: exFAT worked without explicitly acknowledging non-atomic publication'
            exit 1
          fi
          [[ ! -e "$volume/dest" ]]
          target/release/mch -q --allow-nonatomic-publish "$volume/src" "$volume/dest"
          cmp "$volume/src" "$volume/dest"
          # Recheck source and target integrity through different file opens.
          [[ "$(shasum -a 256 "$volume/src" | awk '{print $1}')" == "$(shasum -a 256 "$volume/dest" | awk '{print $1}')" ]]
          printf 'existing data\n' > "$volume/existing"
          if target/release/mch -q --allow-nonatomic-publish "$volume/src" "$volume/existing"; then
            echo 'UNSAFE: existing exFAT target was overwritten'
            exit 1
          fi
          [[ "$(cat "$volume/existing")" == 'existing data' ]]
          if target/release/mch -q --allow-nonatomic-publish --no-hash "$volume/src" "$volume/rejected"; then
            echo 'UNSAFE: allowed fallback without verification'
            exit 1
          fi
          [[ ! -e "$volume/rejected" ]]
          if target/release/mch -q --allow-nonatomic-publish --move "$volume/src" "$volume/rejected"; then
            echo 'UNSAFE: allowed move with non-atomic fallback'
            exit 1
          fi
          [[ ! -e "$volume/rejected" ]]
          echo 'MACOS_EXFAT_EXCLUSIVE_NONATOMIC_OPTIN_PASS'
