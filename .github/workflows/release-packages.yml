name: Release packages
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-packages-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  mac:
    name: Build tagged Apple Silicon executable
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact public version and main ancestry
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - "$TAG" <<'PY'
          import re, subprocess, sys, tomllib
          tag = sys.argv[1]
          with open("Cargo.toml","rb") as f:
              version = tomllib.load(f)["package"]["version"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or tag != "v" + version or tuple(map(int, version.split("."))) < (0, 2, 3):
              sys.exit("invalid or historical tag")
          PY
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.100.0"
      - name: Test and build native release
        shell: bash
        run: |
          set -euo pipefail
          rustc -vV | grep -Fx 'host: aarch64-apple-darwin'
          cargo test --locked
          cargo build --release --locked
          test "$(target/release/mch -v | tail -1)" = "${GITHUB_REF_NAME#v}"
      - name: Preserve the tested Apple Silicon binary
        shell: bash
        run: |
          set -euo pipefail
          actual="$(target/release/mch -v)"
          revision="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/mch-mac-bin"
          cp target/release/mch "$RUNNER_TEMP/mch-mac-bin/mch"
          printf '%s\n' "$revision" > "$RUNNER_TEMP/mch-mac-bin/commit"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/mch-mac-bin/version"
          tar -czf "$RUNNER_TEMP/mch-macos-aarch64.tgz" -C "$RUNNER_TEMP/mch-mac-bin" mch commit version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mch-macos-aarch64-${{ github.sha }}
          path: ${{ runner.temp }}/mch-macos-aarch64.tgz
          if-no-files-found: error
          retention-days: 14
