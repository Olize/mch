name: Release packages

# Trigger on the NEW tag; create a draft, attach all assets, then publish.
# Never rebuild immutable published releases or replace any downloaded asset.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate new stable tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.guard.outputs.tag }}
      sha: ${{ steps.guard.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: guard
        name: Check tag, main ancestry and nonpublished draft
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable version tag"; exit 1; }
          git show-ref --verify "refs/tags/$TAG" >/dev/null
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main || { echo "Tag is not on public main"; exit 1; }
          version="$(git show "$sha:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)"
          [[ "$TAG" == "v$version" ]] || { echo "Tag and Cargo version mismatch"; exit 1; }
          # Deny all historical 0.2.0–0.2.2 rebuilds, even via a moved tag.
          python3 - "$version" <<'VERSION_GUARD'
          import sys
          version = tuple(map(int, sys.argv[1].split(".")))
          if version < (0, 2, 3):
              raise SystemExit("Historical tag: refuse rebuild")
          VERSION_GUARD
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/mch-draft-status 2>/dev/null; then
            [[ "$(cat /tmp/mch-draft-status)" == true ]] || { echo "Already published; refusing replacement"; exit 1; }
            [[ "$(gh release view "$TAG" --json assets --jq '.assets | length')" -eq 0 ]] || { echo "Draft contains assets: manual review required"; exit 1; }
          fi
          printf 'tag=%s\nsha=%s\n' "$TAG" "$sha" >> "$GITHUB_OUTPUT"

  binary:
    name: Binary ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: mch.exe
          - runner: macos-15
            platform: macos-aarch64
            target: aarch64-apple-darwin
            binary: mch
          - runner: ubuntu-22.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: mch
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            binary: mch
          - runner: ubuntu-24.04
            platform: android-aarch64-termux
            target: aarch64-linux-android
            binary: mch
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: "1.99.1"
      - name: Assert native architecture, test and build
        shell: bash
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          rustup target add "$TARGET"
          if [[ "$PLATFORM" == android-aarch64-termux ]]; then
            [[ "$host" == x86_64-unknown-linux-gnu ]] || { echo "Expected x86_64 Linux cross-build host"; exit 1; }
            test -n "$ANDROID_NDK_HOME"
            linker="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
            test -x "$linker"
            export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
            export CC_aarch64_linux_android="$linker"
            ar="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
            test -x "$ar"
            export AR_aarch64_linux_android="$ar"
          else
            [[ "$host" == "$TARGET" ]] || { echo "Wrong native architecture: $host"; exit 1; }
            if [[ "$PLATFORM" == macos-aarch64 ]]; then
              [[ "$(uname -m)" == arm64 ]] || { echo "Not an Apple Silicon machine"; exit 1; }
            fi
            if [[ "$PLATFORM" == linux-aarch64 ]]; then
              [[ "$(uname -m)" == aarch64 ]] || { echo "Not a Linux ARM64 machine"; exit 1; }
            fi
          fi
          cargo test --locked
          cargo build --release --locked --target "$TARGET"
          binary="target/$TARGET/release/$BINARY"
          test -s "$binary"
          version="$(printf '%s' "$TAG" | cut -c2-)"
          if [[ "$PLATFORM" == android-aarch64-termux ]]; then
            readelf -h "$binary" | grep -Eq 'Machine:[[:space:]]+AArch64'
            readelf -l "$binary" | grep -F '/system/bin/linker64'
            if readelf -d "$binary" | grep -E 'libc\.so\.6|ld-linux'; then
              echo 'Refusing glibc-linked binary in Termux archive' >&2
              exit 1
            fi
            echo 'Cross-build: native Termux execution tests are a separate release gate'
          else
            if [[ "$PLATFORM" == linux-aarch64 ]]; then
              readelf -h "$binary" | grep -Eq 'Machine:[[:space:]]+AArch64'
            fi
            actual="$( "$binary" -v | tail -n1 | tr -d '\r' )"
            [[ "$actual" == "$version" ]] || { echo "Wrong executable version: $actual"; exit 1; }
          fi
      - name: Package executable with license and README
        shell: bash
        run: |
          set -euo pipefail
          archive="mch-$TAG-$PLATFORM"
          mkdir -p "bundle/$archive" dist
          cp "target/$TARGET/release/$BINARY" "bundle/$archive/$BINARY"
          cp README.md LICENSE "bundle/$archive/"
          printf 'Version: %s\nTarget: %s\nSource commit: %s\n' "$TAG" "$TARGET" "${{ needs.verify.outputs.sha }}" > "bundle/$archive/BUILD-INFO.txt"
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -Command "Compress-Archive -LiteralPath 'bundle/$archive' -DestinationPath 'dist/$archive.zip' -CompressionLevel Optimal -Force"
          else
            chmod 755 "bundle/$archive/$BINARY"
            tar -czf "dist/$archive.tar.gz" -C bundle "$archive"
          fi
          test "$(find dist -type f | wc -l | tr -d ' ')" -eq 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  source:
    name: Source ZIP and TAR.GZ
    needs: verify
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Archive exactly the tagged public source
        shell: bash
        run: |
          set -euo pipefail
          prefix="mch-$TAG-src"
          mkdir -p dist
          git archive --format=zip --prefix="$prefix/" HEAD > "dist/$prefix.zip"
          git archive --format=tar --prefix="$prefix/" HEAD | gzip -n > "dist/$prefix.tar.gz"
          unzip -Z1 "dist/$prefix.zip" | grep -Fx "$prefix/Cargo.toml"
          tar -tzf "dist/$prefix.tar.gz" | grep -Fx "$prefix/Cargo.lock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sources
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish archives and SHA256 checksums
    needs: [verify, binary, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify all archives and generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import tarfile
          import zipfile

          tag = os.environ["TAG"]
          folder = Path("dist")
          expected = {
              f"mch-{tag}-src.zip",
              f"mch-{tag}-src.tar.gz",
              f"mch-{tag}-windows-x86_64.zip",
              f"mch-{tag}-macos-aarch64.tar.gz",
              f"mch-{tag}-linux-x86_64.tar.gz",
              f"mch-{tag}-linux-aarch64.tar.gz",
              f"mch-{tag}-android-aarch64-termux.tar.gz",
          }
          found = {p.name for p in folder.iterdir() if p.is_file()}
          assert found == expected, f"Expected seven archives, got: {found}"
          for filename in sorted(expected):
              file = folder / filename
              assert file.stat().st_size > 1000, f"Archive is empty: {filename}"
              root = filename.removesuffix(".tar.gz").removesuffix(".zip")
              if filename.endswith(".zip"):
                  with zipfile.ZipFile(file) as z:
                      assert z.testzip() is None
                      members = set(z.namelist())
              else:
                  with tarfile.open(file, "r:gz") as t:
                      members = {m.name for m in t.getmembers()}
              name = "Cargo.toml" if "-src." in filename else ("mch.exe" if "windows" in filename else "mch")
              assert f"{root}/{name}" in members, f"Missing {name} in {filename}"
              if "-src." not in filename:
                  assert f"{root}/README.md" in members
                  assert f"{root}/LICENSE" in members
          with (folder / "SHA256SUMS.txt").open("w", encoding="ascii") as out:
              for filename in sorted(expected):
                  with (folder / filename).open("rb") as src:
                      digest = hashlib.file_digest(src, "sha256").hexdigest()
                  out.write(f"{digest}  {filename}\n")
          print((folder / "SHA256SUMS.txt").read_text())
          PY
      - name: Open empty draft; fail on existing published release or assets
        shell: bash
        run: |
          set -euo pipefail
          # Tag immutability begins only on publication. Guard against
          # a force-moved tag while the platform build jobs were running.
          object_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          if [[ "$object_type" == tag ]]; then
            remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_sha" --jq .object.sha)"
          else
            [[ "$object_type" == commit ]] || { echo "Unsupported tag target"; exit 1; }
          fi
          [[ "$remote_sha" == "$RELEASE_SHA" ]] || { echo "Remote tag moved after validation"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > /tmp/mch-draft 2>/dev/null; then
            [[ "$(cat /tmp/mch-draft)" == true ]] || { echo "Refusing published release"; exit 1; }
            [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 0 ]] || { echo "Draft already contains assets"; exit 1; }
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "MCH $TAG" --notes "Stable MCH $TAG release. See CHANGELOG.md and verify download checksums."
          fi
      - name: Upload verified assets into empty draft
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
      - name: Independently confirm all eight uploaded SHA-256 digests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          # GitHub's by-tag REST endpoint omits unpublished drafts.
          # The gh release view command uses draft-aware GraphQL instead.
          release = json.loads(subprocess.check_output(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "isDraft,assets"], text=True))
          assert release["isDraft"] is True, "Release was published before asset verification"
          local = {p.name: p for p in Path("dist").iterdir() if p.is_file()}
          uploaded = {a["name"]: a for a in release["assets"]}
          assert local.keys() == uploaded.keys() and len(local) == 8, "Release assets differ"
          for name, path in sorted(local.items()):
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              assert uploaded[name].get("digest") == digest, f"Hash mismatch: {name}"
          print("All eight uploaded assets match verified local SHA256")
          PY
      - name: Publish verified draft and REQUIRE GitHub immutability
        shell: bash
        run: |
          set -euo pipefail
          # Independently verify tag identity AGAIN immediately before sealing.
          object_type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)"
          remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          if [[ "$object_type" == tag ]]; then
            remote_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_sha" --jq .object.sha)"
          else
            [[ "$object_type" == commit ]] || { echo "Unsupported tag target"; exit 1; }
          fi
          [[ "$remote_sha" == "$RELEASE_SHA" ]] || { echo "Remote tag changed before publication"; exit 1; }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          sealed="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .immutable)"
          [[ "$sealed" == true ]] || { echo "CRITICAL: published release is NOT immutable"; exit 1; }
          count="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          [[ "$count" -eq 8 ]] || { echo "Expected eight immutable release assets"; exit 1; }
          echo "Published $TAG: eight verified immutable assets"
