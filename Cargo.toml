[package]
name = "mch"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Mighty Copy with Hash (mch) - copy/move with post-copy verification (default: BLAKE3)."
repository = "https://github.com/Olize/mch"
readme = "README.md"

[package.metadata.mch-release]
approved_unix_resume = "v1-single-file-and-v2-directory-reviewed-0.4.0"
reviewed_runtime = "24e398b743cb73af0a679f01a52072b0eabf3e1b"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

blake3 = "1"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hex = "0.4"

rayon = "1"
filetime = "0.2.29"
unicode-normalization = "0.1.24"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = "3"
