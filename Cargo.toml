[package]
name = "mch"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Mighty Copy with Hash (mch) - copy/move with post-copy verification (default: BLAKE3)."
repository = "https://github.com/Olize/mch"
readme = "README.md"

[package.metadata.mch-release]
# Explicit review decision; automatic version bump alone must not publish resume.
approved_unix_resume = "v1-single-regular-file"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

blake3 = "1"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hex = "0.4"

rayon = "1"
filetime = "0.2.29"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
